name: mm-inches release

on:
  workflow_run:
    workflows:
      - mm-inches CI
    types:
      - completed
  push:
    tags:
      - mm-inches-v*.*.*

permissions:
  contents: write

concurrency:
  group: release-mm-inches
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/mm-inches-ci.yaml

  prepare:
    needs: ci
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/mm-inches-v') &&
          needs.ci.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      automatic: ${{ steps.release.outputs.automatic }}
      image-tag: ${{ steps.release.outputs.image-tag }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select release version
        id: release
        env:
          PUSH_SOURCE_SHA: ${{ github.sha }}
          PUSH_TAG: ${{ github.ref_name }}
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          automatic=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            automatic=true
            source_sha="$WORKFLOW_SOURCE_SHA"
            release_tag="$(git tag --list 'mm-inches-v*.*.*' --points-at "$source_sha" --sort=-v:refname | sed -n '1p')"

            if [[ -z "$release_tag" ]]; then
              latest_tag="$(git tag --list 'mm-inches-v*.*.*' --sort=-v:refname | sed -n '1p')"
              if [[ -z "$latest_tag" ]]; then
                release_tag="mm-inches-v0.1.0"
              elif [[ "$latest_tag" =~ ^mm-inches-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                patch="$((10#${BASH_REMATCH[3]} + 1))"
                release_tag="mm-inches-v${major}.${minor}.${patch}"
              else
                echo "latest release tag is not valid semantic versioning: $latest_tag" >&2
                exit 1
              fi
            fi
          else
            source_sha="$PUSH_SOURCE_SHA"
            release_tag="$PUSH_TAG"
          fi

          if [[ ! "$release_tag" =~ ^mm-inches-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match mm-inches-vMAJOR.MINOR.PATCH; got $release_tag" >&2
            exit 1
          fi

          {
            echo "automatic=$automatic"
            echo "image-tag=${release_tag#mm-inches-}"
            echo "release-tag=$release_tag"
            echo "source-sha=$source_sha"
          } >>"$GITHUB_OUTPUT"

  publish:
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ needs.prepare.outputs.image-tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0 # v4.6.0
        with:
          username: tyler180
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1 # v4.4.1

      - name: Generate image metadata
        id: image
        uses: docker/metadata-action@v6.2.0 # v6.2.0
        with:
          images: tyler180/mm-inches
          tags: type=raw,value=${{ needs.prepare.outputs.image-tag }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.4.0 # v7.4.0
        with:
          context: ./mm-inches
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  tag-release:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source-sha }}

      - name: Create or verify release tag
        env:
          AUTOMATIC: ${{ needs.prepare.outputs.automatic }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: |
          existing_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            if [[ "$existing_sha" != "$SOURCE_SHA" ]]; then
              echo "$RELEASE_TAG already points to $existing_sha, not $SOURCE_SHA" >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points to the release commit"
            exit 0
          fi

          if [[ "$AUTOMATIC" != "true" ]]; then
            echo "manually supplied release tag $RELEASE_TAG was not found" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "Release ${RELEASE_TAG#mm-inches-}"
          git push origin "refs/tags/$RELEASE_TAG"

  propose-deployment:
    needs:
      - prepare
      - publish
      - tag-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_BRANCH: deploy/mm-inches-${{ needs.publish.outputs.tag }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          repository: tyler180/talos-gitops
          ref: main
          path: talos-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.35.0
          KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kubectl-bin"
          install -m 0755 /tmp/kubectl "$RUNNER_TEMP/kubectl-bin/kubectl"
          echo "$RUNNER_TEMP/kubectl-bin" >>"$GITHUB_PATH"

      - name: Update deployment image
        id: deployment
        working-directory: talos-gitops
        run: |
          image_reference="tyler180/mm-inches:${IMAGE_TAG}@${IMAGE_DIGEST}"
          sed -i -E \
            "s#image: tyler180/mm-inches[^[:space:]]*#image: ${image_reference}#" \
            applications/mm-inches/deployment.yaml
          grep -F "image: ${image_reference}" applications/mm-inches/deployment.yaml
          git diff --check
          kubectl kustomize applications/mm-inches >/tmp/mm-inches-rendered.yaml
          if git diff --quiet -- applications/mm-inches/deployment.yaml; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Push deployment branch
        if: steps.deployment.outputs.changed == 'true'
        working-directory: talos-gitops
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$DEPLOY_BRANCH"
          git add applications/mm-inches/deployment.yaml
          git commit -m "deploy mm-inches ${IMAGE_TAG}"
          git push --force-with-lease origin "$DEPLOY_BRANCH"

      - name: Open GitOps pull request
        if: steps.deployment.outputs.changed == 'true'
        working-directory: talos-gitops
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number="$(gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Source commit: ${SOURCE_SHA}

          Image: \`tyler180/mm-inches:${IMAGE_TAG}@${IMAGE_DIGEST}\`

          Build: ${RUN_URL}"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Deploy mm-inches ${IMAGE_TAG}" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$DEPLOY_BRANCH" \
              --title "Deploy mm-inches ${IMAGE_TAG}" \
              --body "$body"
          fi
