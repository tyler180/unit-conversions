name: mm-inches release

on:
  push:
    tags:
      - mm-inches-v*.*.*

permissions:
  contents: read

concurrency:
  group: release-mm-inches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate semantic version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^mm-inches-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match mm-inches-vMAJOR.MINOR.PATCH; got $RELEASE_TAG" >&2
            exit 1
          fi

  ci:
    uses: ./.github/workflows/mm-inches-ci.yaml

  publish:
    needs:
      - validate-tag
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0 # v4.6.0
        with:
          username: tyler180
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1 # v4.4.1

      - name: Derive image version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "value=${RELEASE_TAG#mm-inches-}" >>"$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: image
        uses: docker/metadata-action@v6.2.0 # v6.2.0
        with:
          images: tyler180/mm-inches
          tags: type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7.4.0 # v7.4.0
        with:
          context: ./mm-inches
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  propose-deployment:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_BRANCH: deploy/mm-inches-${{ needs.publish.outputs.tag }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          repository: tyler180/talos-gitops
          ref: main
          path: talos-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.35.0
          KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kubectl-bin"
          install -m 0755 /tmp/kubectl "$RUNNER_TEMP/kubectl-bin/kubectl"
          echo "$RUNNER_TEMP/kubectl-bin" >>"$GITHUB_PATH"

      - name: Update deployment image
        working-directory: talos-gitops
        run: |
          sed -i -E \
            "s#image: tyler180/mm-inches(@sha256:[a-f0-9]+|:[^[:space:]]+)#image: tyler180/mm-inches:${IMAGE_TAG}#" \
            applications/mm-inches/deployment.yaml
          grep -F "image: tyler180/mm-inches:${IMAGE_TAG}" applications/mm-inches/deployment.yaml
          git diff --check
          kubectl kustomize applications/mm-inches >/tmp/mm-inches-rendered.yaml

      - name: Push deployment branch
        working-directory: talos-gitops
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$DEPLOY_BRANCH"
          git add applications/mm-inches/deployment.yaml
          git commit -m "deploy mm-inches ${IMAGE_TAG}"
          git push --force-with-lease origin "$DEPLOY_BRANCH"

      - name: Open GitOps pull request
        working-directory: talos-gitops
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number="$(gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Source commit: ${SOURCE_SHA}

          Image: \`tyler180/mm-inches:${IMAGE_TAG}\`

          Build: ${RUN_URL}"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Deploy mm-inches ${IMAGE_TAG}" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$DEPLOY_BRANCH" \
              --title "Deploy mm-inches ${IMAGE_TAG}" \
              --body "$body"
          fi
